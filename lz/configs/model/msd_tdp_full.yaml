_target_: src.models.lightning_modules.lz_module.LZLitModule

net:
  _target_: src.models.networks.lz_model.LZModel
  backbone:
    _target_: src.models.networks.lz_backbone.msd_spunet34c_adapter.MSDSpUNet34CAdapter
    in_channels: 6
    out_dim: 128
    grid_size: 0.02
    pad: 128
    base_channels: 32
    channels: [32, 64, 128, 256, 256, 128, 96, 96]
    layers: [2, 3, 4, 6, 2, 2, 2, 2]
    fine_grid_size: 0.01
    fine_channels: [16, 32, 64, 64, 32, 16]
    fine_layers: [1, 1, 1, 1, 1, 1]
    fine_out_dim: 64
    lkcb_kernel: 9
    csas_hidden_dim: 64
    norm_type: bn
    hash_method: fnv
    pooling_method: mean
  decoder:
    _target_: src.models.networks.lz_decoder.tdp_decoder.TDPDecoder
    in_dim: 128
    num_classes: ${data.num_classes}
    instance_dim: 32
    proto_dim: 128
    tau: 0.1
    ema_momentum: 0.99
    warmup_steps: 500
    warmup_momentum: 0.9
    hidden_dim: 128
    top_k: null
    tail_class_indices:
      [69, 75, 84, 86, 87, 93, 94, 96, 102, 107,
       111, 112, 114, 116, 119, 121, 122, 123, 124, 126,
       127, 131, 132, 133, 136, 137, 138, 139, 140, 141,
       143, 144, 147, 148, 149, 150, 152, 153, 155, 156,
       157, 158, 159, 160, 161, 162, 164, 165, 166, 167,
       170, 179, 181, 183, 184, 185, 187, 188, 189, 190,
       192, 193, 194, 195, 196, 198]
  text_dim: ${model.text_encoder_cfg.embed_dim}
  use_tta_adapter: true
  adapter_dropout: 0.0

optimizer: ${optim}
scheduler: ${scheduler}
scheduler_interval: step

loss_cfg: ${model.loss}

eval_cfg:
  use_tta: false
  rotations: [0, 90, 180, 270]
  flips: [false, true]
  temperature: 1.0
  use_adapter_tta: true
  adapter_steps: 1
  adapter_lr: 0.001
  adapter_weight_decay: 0.0
  entropy_weight: 1.0

text_encoder_cfg:
  use_clip: true
  model_id: hf-hub:UCSC-VLAA/ViT-L-16-HTxt-Recap-CLIP
  pretrained: null
  embed_dim: 768
  device: cpu

best_metric: val/miou
zero_shot: false
